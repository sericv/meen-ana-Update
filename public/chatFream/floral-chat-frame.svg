  <defs>
    <!-- 9-slice: corner slice ≈52px; stretch edges; center is clean fill -->
    <filter id="bs" x="-12%" y="-10%" width="124%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#F472B6" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="bf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEFCFE"/>
      <stop offset="30%" stop-color="#FCE7F3"/>
      <stop offset="100%" stop-color="#FAD8EC"/>
    </linearGradient>
    <!-- radial petal gradient — cx/cy at local 0,0 so it centers at each flower -->
    <radialGradient id="pg" cx="0" cy="0" r="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.94"/>
      <stop offset="36%" stop-color="#FDE4F0"/>
      <stop offset="100%" stop-color="#F9A8D4"/>
    </radialGradient>
    <radialGradient id="pgs" cx="0" cy="0" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.90"/>
      <stop offset="40%" stop-color="#FDE8F2"/>
      <stop offset="100%" stop-color="#FCA5C2"/>
    </radialGradient>
  </defs>

